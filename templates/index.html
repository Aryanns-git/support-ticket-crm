<!DOCTYPE html>
<html>
<head>
    <title>Support Ticket CRM</title>
    <style>
        body { font-family: Arial; background: #f4f7fb; padding: 20px; }
        .box { background: white; padding: 20px; margin-bottom: 20px; border-radius: 10px; }
        input, select { padding: 8px; margin: 5px; }
        button { padding: 8px 12px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: center; }
        th { background: #4CAF50; color: white; }
        #detailBox { display: none; border-left: 5px solid #4CAF50; }
    </style>
</head>
<body>

<h1>Support Ticket CRM</h1>

<div class="box">
    <h2>Create Ticket</h2>

    <input id="name" placeholder="Customer Name" required>
    <input id="email" placeholder="Customer Email" required>
    <input id="subject" placeholder="Issue Subject" required>
    <input id="description" placeholder="Description" required>

    <button onclick="createTicket()">Create Ticket</button>
</div>

<div class="box">
    <h2>Search & Filter</h2>
    <input id="search" placeholder="Search tickets" onkeyup="loadTickets()">
    <select id="statusFilter" onchange="loadTickets()">
        <option value="">All</option>
        <option value="Open">Open</option>
        <option value="In Progress">In Progress</option>
        <option value="Closed">Closed</option>
    </select>
</div>

<div class="box" id="detailBox">
    <h2>Ticket Details</h2>
    <p><b>Ticket ID:</b> <span id="detailTicketId"></span></p>
    <p><b>Name:</b> <span id="detailName"></span></p>
    <p><b>Email:</b> <span id="detailEmail"></span></p>
    <p><b>Subject:</b> <span id="detailSubject"></span></p>
    <p><b>Description:</b> <span id="detailDescription"></span></p>
    <p><b>Status:</b> <span id="detailStatus"></span></p>
    <button onclick="hideDetails()">Close</button>
</div>

<table>
    <thead>
        <tr>
            <th>Ticket ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Subject</th>
            <th>Status</th>
            <th>Date</th>
            <th>Update</th>
            <th>View</th>
        </tr>
    </thead>
    <tbody id="ticketTable"></tbody>
</table>

<script>
const API_URL = "https://support-ticket-crm-wkkq.onrender.com";

async function createTicket() {
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const subject = document.getElementById("subject").value.trim();
    const description = document.getElementById("description").value.trim();

    if (!name || !email || !subject || !description) {
        alert("All fields are mandatory. Please fill all ticket details.");
        return;
    }

    const data = {
        customer_name: name,
        customer_email: email,
        subject: subject,
        description: description
    };

    await fetch(API_URL + "/api/tickets", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
    });

    loadTickets();
}
async function loadTickets() {
    const search = document.getElementById("search").value;
    const status = document.getElementById("statusFilter").value;

    const res = await fetch(API_URL + `/api/tickets?search=${search}&status=${status}`);
    const data = await res.json();

    const table = document.getElementById("ticketTable");
    table.innerHTML = "";

    data.forEach(t => {
        table.innerHTML += `
            <tr>
                <td>${t.ticket_id}</td>
                <td>${t.customer_name}</td>
                <td>${t.customer_email}</td>
                <td>${t.subject}</td>
                <td>${t.status}</td>
                <td>${t.created_at}</td>
                <td>
                    <select onchange="updateStatus('${t.ticket_id}', this.value)">
                        <option ${t.status === "Open" ? "selected" : ""}>Open</option>
                        <option ${t.status === "In Progress" ? "selected" : ""}>In Progress</option>
                        <option ${t.status === "Closed" ? "selected" : ""}>Closed</option>
                    </select>
                </td>
                <td>
                    <button onclick="viewTicket('${t.ticket_id}')">View</button>
                </td>
            </tr>
        `;
    });
}

async function updateStatus(ticketId, status) {
    await fetch(API_URL + `/api/tickets/${ticketId}`, {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({status})
    });

    loadTickets();
}

async function viewTicket(ticketId) {
    const res = await fetch(API_URL + `/api/tickets/${ticketId}`);
    const t = await res.json();

    document.getElementById("detailTicketId").innerText = t.ticket_id;
    document.getElementById("detailName").innerText = t.customer_name;
    document.getElementById("detailEmail").innerText = t.customer_email;
    document.getElementById("detailSubject").innerText = t.subject;
    document.getElementById("detailDescription").innerText = t.description;
    document.getElementById("detailStatus").innerText = t.status;

    document.getElementById("detailBox").style.display = "block";
}

function hideDetails() {
    document.getElementById("detailBox").style.display = "none";
}

loadTickets();
</script>

</body>
</html>
