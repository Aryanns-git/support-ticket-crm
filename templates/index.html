<!DOCTYPE html>
<html>
<head>
    <title>Support Ticket CRM</title>
    <style>
        body { font-family: Arial; background: #f4f7fb; padding: 20px; }
        .box { background: white; padding: 20px; margin-bottom: 20px; border-radius: 10px; }
        input, select { padding: 8px; margin: 5px; }
        button { padding: 8px 12px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: center; }
        th { background: #4CAF50; color: white; }
        #detailBox { display: none; border-left: 5px solid #4CAF50; }
    </style>
</head>
<body>

<h1>Support Ticket CRM</h1>

<div class="box">
    <h2>Create Ticket</h2>

    <input id="name" placeholder="Customer Name" required>
    <input id="email" placeholder="Customer Email" required>
    <input id="subject" placeholder="Issue Subject" required>
    <input id="description" placeholder="Description" required>

    <button onclick="createTicket()">Create Ticket</button>
    <button onclick="resetForm()"> Reset </button>
</div>

<div class="box">
    <h2>Search & Filter</h2>
    <input id="search" placeholder="Search tickets" onkeyup="loadTickets()">
    <select id="statusFilter" onchange="loadTickets()">
        <option value="">All</option>
        <option value="Open">Open</option>
        <option value="In Progress">In Progress</option>
        <option value="Closed">Closed</option>
    </select>
</div>


<table>
    <thead>
        <tr>
            <th>Ticket ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Subject</th>
            <th>Status</th>
            <th>Date</th>
            <th>Update</th>
            <th>View</th>
            <th>Delete</th>
        </tr>
    </thead>
    <tbody id="ticketTable"></tbody>
</table>

<script>
const API_URL = "https://support-ticket-crm-wkkq.onrender.com";

async function createTicket() {
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const subject = document.getElementById("subject").value.trim();
    const description = document.getElementById("description").value.trim();

    if (!name || !email || !subject || !description) {
        alert("All fields are mandatory. Please fill all ticket details.");
        return;
    }

    const data = {
        customer_name: name,
        customer_email: email,
        subject: subject,
        description: description
    };

    await fetch(API_URL + "/api/tickets", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
    });

    loadTickets();
    resetForm();
}

async function deleteTicket(ticketId) {
    if (!confirm("Are you sure you want to delete this ticket?")) {
        return;
    }

    await fetch(API_URL + `/api/tickets/${ticketId}`, {
        method: "DELETE"
    });

    loadTickets();
}

async function loadTickets() {
    const search = document.getElementById("search").value;
    const status = document.getElementById("statusFilter").value;

    const res = await fetch(API_URL + `/api/tickets?search=${search}&status=${status}`);
    const data = await res.json();

    const table = document.getElementById("ticketTable");
    table.innerHTML = "";

    data.forEach(t => {
        table.innerHTML += `
            <tr>
                <td>${t.ticket_id}</td>
                <td>${t.customer_name}</td>
                <td>${t.customer_email}</td>
                <td>${t.subject}</td>
                <td>${t.status}</td>
                <td>${t.created_at}</td>
                <td>
                    <select onchange="updateStatus('${t.ticket_id}', this.value)">
                        <option ${t.status === "Open" ? "selected" : ""}>Open</option>
                        <option ${t.status === "In Progress" ? "selected" : ""}>In Progress</option>
                        <option ${t.status === "Closed" ? "selected" : ""}>Closed</option>
                    </select>
                </td>
               <td>
    <<button onclick="window.open('/ticket-details?ticket_id=${t.ticket_id}', '_blank')">View</button>
</td>
<td>
    <button onclick="deleteTicket('${t.ticket_id}')">Delete</button>
</td>
            </tr>
        `;
    });
}

async function updateStatus(ticketId, status) {
    await fetch(API_URL + `/api/tickets/${ticketId}`, {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({status})
    });

    loadTickets();
}


function resetForm() {
    document.getElementById("name").value = "";
    document.getElementById("email").value = "";
    document.getElementById("subject").value = "";
    document.getElementById("description").value = "";
}

loadTickets();
</script>

</body>
</html>
