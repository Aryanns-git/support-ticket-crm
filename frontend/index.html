</head>

<body>

<h1>CRM System</h1>

<div class="box">
    <h3>Add Customer</h3>
    <input type="text" id="name" placeholder="Name">
    <input type="email" id="email" placeholder="Email">
    <button class="add" onclick="addCustomer()">Add</button>
</div>

<div class="box">
    <h3>Search</h3>
    <input type="text" id="search" placeholder="Search name/email">
    <button onclick="searchCustomer()">Search</button>
    <button onclick="loadCustomers()">Reset</button>
</div>

<div class="box">
    <h3>Customers</h3>

```
<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody id="tableBody"></tbody>
</table>

<br>
<button onclick="prevPage()">⬅ Prev</button>
<button onclick="nextPage()">Next ➡</button>
```

</div>

<script>
    const API = "https://support-ticket-crm-wkkq.onrender.com";
    let page = 0;

    async function loadCustomers() {
        let res = await fetch(API + `/customers?skip=${page*5}&limit=5`);
        let data = await res.json();

        renderTable(data);
    }

    function renderTable(data) {
        let table = document.getElementById("tableBody");
        table.innerHTML = "";

        data.forEach(c => {
            table.innerHTML += `
                <tr>
                    <td>${c.id}</td>
                    <td>${c.name}</td>
                    <td>${c.email}</td>
                    <td>
                        <button class="edit" onclick="editCustomer(${c.id})">Edit</button>
                        <button class="delete" onclick="deleteCustomer(${c.id})">Delete</button>
                    </td>
                </tr>
            `;
        });
    }

    async function addCustomer() {
        let name = document.getElementById("name").value;
        let email = document.getElementById("email").value;

        await fetch(API + "/add-customer", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({name, email})
        });

        loadCustomers();
    }

    async function deleteCustomer(id) {
        await fetch(API + `/delete-customer/${id}`, {
            method: "DELETE"
        });

        loadCustomers();
    }

    async function editCustomer(id) {
        let name = prompt("New name:");
        let email = prompt("New email:");

        await fetch(API + `/update-customer/${id}`, {
            method: "PUT",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({name, email})
        });

        loadCustomers();
    }

    async function searchCustomer() {
        let query = document.getElementById("search").value;

        let res = await fetch(API + `/search?query=${query}`);
        let data = await res.json();

        renderTable(data);
    }

    function nextPage() {
        page++;
        loadCustomers();
    }

    function prevPage() {
        if(page > 0) page--;
        loadCustomers();
    }

    loadCustomers();
</script>

</body>
</html>
